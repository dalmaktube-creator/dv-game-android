name: android

on:
  push:
    branches: [main, feat/app-v1, feat/app-v2-ui]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      publish_alpha15:
        description: "Publish the Alpha 15 release (explicit approval only)"
        required: false
        default: "false"
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    # feat/app-v1 already builds on push; skip the duplicate PR synchronization job.
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/app-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download and verify pinned full libbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs /tmp/libbox
          curl -fL --retry 3 -o /tmp/libbox.zip https://github.com/proother/sing-box-lib/releases/download/v1.13.19/libbox-android.aar.zip
          echo "493bed8217b7c25d5699f964a7fcedd0d4d2d79abc72e4070a89709833b74f57  /tmp/libbox.zip" | sha256sum -c -
          unzip -q /tmp/libbox.zip -d /tmp/libbox
          AAR="$(find /tmp/libbox -name 'libbox.aar' -print -quit)"
          test -n "$AAR"
          cp "$AAR" app/libs/libbox.aar
          unzip -p app/libs/libbox.aar classes.jar > /tmp/libbox-classes.jar
          jar tf /tmp/libbox-classes.jar | grep -qx 'io/nekohasekai/libbox/CommandServer.class'
          sha256sum app/libs/libbox.aar | tee libbox.sha256

      - name: Restore stable Alpha signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DV_GAME_CI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DV_GAME_CI_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "Stable signing key unavailable; the build will use an ephemeral debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dv-game-ci-signing.p12"
          keytool -list -keystore "$RUNNER_TEMP/dv-game-ci-signing.p12" -storepass "$KEYSTORE_PASSWORD" -alias dv-game-ci >/dev/null
          echo "DV_GAME_KEYSTORE_PATH=$RUNNER_TEMP/dv-game-ci-signing.p12" >> "$GITHUB_ENV"
          echo "DV_GAME_CI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build Alpha 15 debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk DV-Game-0.2.0-alpha15-debug.apk
          sha256sum DV-Game-0.2.0-alpha15-debug.apk | awk '{ print $1 }' > DV-Game-0.2.0-alpha15-debug.apk.sha256
          APK_SHA256="$(cat DV-Game-0.2.0-alpha15-debug.apk.sha256)"
          VERSION_CODE="$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+')"
          VERSION_NAME="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)"
          cat > dv-game-update.json <<JSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "packageName": "com.dvgame.app",
            "sha256": "$APK_SHA256",
            "signatureSha256": "3f4a9eeb1bc8a7d6a4eac46ae5bcecd09ad61ec2d64e6363b4cc19aa64a85b1c",
            "primaryUrl": "https://github.com/dalmaktube-creator/dv-game-android/releases/download/alpha-latest/DV-Game-0.2.0-alpha15-debug.apk",
            "mirrorUrl": "",
            "notes": "DV Game 0.2.0 Alpha 15"
          }
          JSON

      - name: Verify stable APK signature
        if: env.DV_GAME_KEYSTORE_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs DV-Game-0.2.0-alpha14-debug.apk | tee apk-signing.txt
          grep -Eqi '^V[0-9.]+ Signer: certificate SHA-256 digest: 3f4a9eeb1bc8a7d6a4eac46ae5bcecd09ad61ec2d64e6363b4cc19aa64a85b1c$' apk-signing.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dv-game-alpha14-debug-apk
          path: |
            DV-Game-0.2.0-alpha14-debug.apk
            DV-Game-0.2.0-alpha14-debug.apk.sha256
            dv-game-update.json
            libbox.sha256
            apk-signing.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Alpha 14 release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_alpha14 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=""
          for asset in DV-Game-0.2.0-alpha14-debug.apk DV-Game-0.2.0-alpha14-debug.apk.sha256 dv-game-update.json libbox.sha256 apk-signing.txt; do
            if [ -f "$asset" ]; then
              ASSETS="$ASSETS $asset"
            fi
          done
          test -n "$ASSETS"
          if gh release view v0.2.0-alpha.14 >/dev/null 2>&1; then
            gh release upload v0.2.0-alpha.14 $ASSETS --clobber
          else
            gh release create v0.2.0-alpha.14 $ASSETS \
              --target "$GITHUB_SHA" \
              --title "DV Game 0.2.0 Alpha 14" \
              --prerelease \
              --notes "پیاده‌سازی بومی کانسپت Minimal Boost با ظاهر تیره، دکمه اتصال و موج‌های انیمیشنی، منوی تنظیمات و انتخاب بازی و سرور؛ همراه با به‌روزرسانی امن درون‌برنامه‌ای."
          fi
          if gh release view alpha-latest >/dev/null 2>&1; then
            gh release upload alpha-latest $ASSETS --clobber
          else
            gh release create alpha-latest $ASSETS \
              --target "$GITHUB_SHA" \
              --title "DV Game Alpha (latest)" \
              --prerelease \
              --notes "این انتشار همیشه به آخرین نسخه آلفا اشاره می‌کند و منبع ثابت به‌روزرسانی درون‌برنامه‌ای است."
          fi

      - name: Report failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Android build diagnostics'
            echo '```text'
            grep -nE '(^e: |error:|Unresolved reference|Compilation error|FAILED|FAILURE:|What went wrong|AssertionError)' build.log 2>/dev/null | tail -n 200 || true
            echo '```'
          } > build-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file build-comment.md
