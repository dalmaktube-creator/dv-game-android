name: android

on:
  push:
    branches: [main, feat/app-v1, agent/alpha5-xray-wireguard-compat]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Fetch pinned UDP compatibility dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a /tmp/dv-hev
          curl -fL --retry 4 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar
          echo "670cf11d9d10a6bb6548ac4f593acfa4339155732f6f8de4d45923f30a74deed  app/libs/libv2ray.aar" | sha256sum -c -
          curl -fL --retry 4 -o /tmp/v2rayng.apk \
            https://github.com/2dust/v2rayNG/releases/download/2.2.6/v2rayNG_2.2.6_arm64-v8a.apk
          echo "62b0675c0986a8613f1bb67f1a68c366c6357e04a68687a3bd907170594c437d  /tmp/v2rayng.apk" | sha256sum -c -
          unzip -q /tmp/v2rayng.apk 'lib/arm64-v8a/libhev-socks5-tunnel.so' -d /tmp/dv-hev
          cp /tmp/dv-hev/lib/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/
      - name: Test and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk DV-Game-0.2.0-alpha05-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dv-game-alpha05-debug-apk
          path: DV-Game-0.2.0-alpha05-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/app-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.2.0-alpha.5 \
            DV-Game-0.2.0-alpha05-debug.apk \
            --target "$GITHUB_SHA" \
            --title "DV Game 0.2.0 Alpha 5" \
            --prerelease \
            --notes "موتور سازگار UDP مخصوص بازی، بر پایه تست واقعی Mobile Legends. رابط Per-App اندروید حفظ شده و فقط بازی و سرویس‌های ضروری Google وارد TUN می‌شوند؛ سپس HEV SOCKS5 نشست‌های UDP را مدیریت می‌کند و Xray همان کانفیگ WireGuard پنل را به‌عنوان outbound اجرا می‌کند. DNS پنل داخل WireGuard باقی می‌ماند و مرورگر و سایر برنامه‌ها مستقیم هستند. وابستگی‌های باینری با نسخه و SHA-256 ثابت دریافت می‌شوند. این نسخه فعلاً فقط arm64-v8a و آزمایشی است."
      - name: Report failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Android compiler diagnostics'
            echo '```text'
            grep -nE '(^e: |error:|Unresolved reference|Compilation error|FAILED|FAILURE:|What went wrong|AssertionError)' build.log | tail -n 200 || true
            echo '```'
          } > build-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file build-comment.md
