name: android

on:
  push:
    branches: [main, feat/app-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk DV-Game-0.2.0-alpha04-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dv-game-debug-apk
          path: DV-Game-0.2.0-alpha04-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/app-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.2.0-alpha.4 \
            DV-Game-0.2.0-alpha04-debug.apk \
            --target "$GITHUB_SHA" \
            --title "DV Game 0.2.0 Alpha 4" \
            --prerelease \
            --notes "نسخه آزمایشی اصلاح مسیر IPv6 در Per-App WireGuard. اگر کانفیگ پنل فقط آدرس IPv4 داشته باشد، مسیر ::/0 برای اپ حذف و IPv6 به‌صورت fail-closed مسدود می‌شود تا بازی منتظر مسیر IPv6 بدون آدرس نماند. DNS Lock، DNS کانفیگ، MTU، Endpoint، مسیر IPv4 و Keepalive دست‌نخورده‌اند. سرویس‌های ضروری Google Play و telemetry آلفا ۳ حفظ شده‌اند."
      - name: Report failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Android compiler diagnostics'
            echo '```text'
            grep -nE '(^e: |error:|Unresolved reference|Compilation error|FAILED|FAILURE:|What went wrong|AssertionError)' build.log | tail -n 160 || true
            echo '```'
          } > build-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file build-comment.md
