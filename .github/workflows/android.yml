name: android

on:
  push:
    branches: [main, feat/app-v1, feat/libbox-game-engine]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false
      - name: Setup Android NDK r28
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build pinned sing-box libbox for arm64
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.13.19 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          sha256sum "$GITHUB_WORKSPACE/app/libs/libbox.aar" | tee "$GITHUB_WORKSPACE/libbox.sha256"
      - name: Test and build Alpha 6 debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk DV-Game-0.2.0-alpha06-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dv-game-alpha06-debug-apk
          path: |
            DV-Game-0.2.0-alpha06-debug.apk
            libbox.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Report failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo '### Android compiler diagnostics'; echo '```text'; grep -nE '(^e: |error:|Unresolved reference|Compilation error|FAILED|FAILURE:|What went wrong|AssertionError)' build.log | tail -n 200 || true; echo '```'; } > build-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file build-comment.md
