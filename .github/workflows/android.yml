name: android

on:
  push:
    branches: [main, feat/app-v1, feat/libbox-game-engine]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download pinned full libbox with Clash API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs /tmp/libbox
          curl -fL --retry 3 \
            -o /tmp/libbox.zip \
            https://github.com/proother/sing-box-lib/releases/download/v1.13.19/libbox-android.aar.zip
          echo "493bed8217b7c25d5699f964a7fcedd0d4d2d79abc72e4070a89709833b74f57  /tmp/libbox.zip" | sha256sum -c -
          unzip -q /tmp/libbox.zip -d /tmp/libbox
          AAR="$(find /tmp/libbox -name 'libbox.aar' -print -quit)"
          test -n "$AAR"
          cp "$AAR" app/libs/libbox.aar
          sha256sum app/libs/libbox.aar | tee libbox.sha256

      - name: Test and build Alpha 7 debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk DV-Game-0.2.0-alpha07-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dv-game-alpha07-debug-apk
          path: |
            DV-Game-0.2.0-alpha07-debug.apk
            libbox.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish Alpha 7 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/app-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0-alpha.7 >/dev/null 2>&1; then
            gh release upload v0.2.0-alpha.7 DV-Game-0.2.0-alpha07-debug.apk libbox.sha256 --clobber
          else
            gh release create v0.2.0-alpha.7 \
              DV-Game-0.2.0-alpha07-debug.apk libbox.sha256 \
              --target "$GITHUB_SHA" \
              --title "DV Game 0.2.0 Alpha 7" \
              --prerelease \
              --notes "رفع خطای clash api: این نسخه از libbox کامل v1.13.19 با تگ with_clash_api استفاده می‌کند. هسته sing-tun mixed stack و WireGuard outbound حفظ شده‌اند. بازی‌های مجاز همچنان فقط از پنل تعیین می‌شوند."
          fi

      - name: Report failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Android build diagnostics'
            echo '```text'
            grep -nE '(^e: |error:|Unresolved reference|Compilation error|FAILED|FAILURE:|What went wrong|AssertionError)' build.log 2>/dev/null | tail -n 200 || true
            echo '```'
          } > build-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file build-comment.md
